[project]
name = "codex-switcher"
version = "0.1.2"
description = "Rich TUI for switching Codex.app ChatGPT sessions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
]

[project.scripts]
codex-switcher = "codex_switcher.cli.main:main"
codex-switcher-backend = "codex_switcher.backend.server:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
